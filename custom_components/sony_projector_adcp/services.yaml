send_key:
  name: Send Key
  description: Send a remote control key command to the projector
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    key:
      name: Key
      description: The remote control key to send
      required: true
      selector:
        select:
          options:
            - label: Menu
              value: menu
            - label: Up
              value: up
            - label: Down
              value: down
            - label: Left
              value: left
            - label: Right
              value: right
            - label: Enter
              value: enter
            - label: Reset
              value: reset
            - label: Blank (Video Mute)
              value: blank

set_picture_mode:
  name: Set Picture Mode
  description: Set the picture preset mode
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    mode:
      name: Picture Mode
      description: The picture mode to set
      required: true
      selector:
        select:
          options:
            - label: Cinema Film 1
              value: cinema_film1
            - label: Cinema Film 2
              value: cinema_film2
            - label: Reference
              value: reference
            - label: TV
              value: tv
            - label: Photo
              value: photo
            - label: Game
              value: game
            - label: Bright Cinema
              value: brt_cinema
            - label: Bright TV
              value: brt_tv
            - label: User 1
              value: user1
            - label: User 2
              value: user2
            - label: User 3
              value: user3

set_brightness:
  name: Set Brightness
  description: Set the brightness level
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    value:
      name: Brightness
      description: Brightness level (0-100)
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

set_contrast:
  name: Set Contrast
  description: Set the contrast level
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    value:
      name: Contrast
      description: Contrast level (0-100)
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

set_sharpness:
  name: Set Sharpness
  description: Set the sharpness level
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    value:
      name: Sharpness
      description: Sharpness level (0-100)
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider

# set_light_output / increase_light_output / decrease_light_output were removed:
# light_output_val is the VPL-XW5000's laser command and answers err_cmd on the
# lamp-based VW715ES. Use set_lamp_control instead.

set_lamp_control:
  name: Set Lamp Control
  description: Set the lamp output level (Low or High)
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    mode:
      name: Mode
      description: Lamp output level
      required: true
      selector:
        select:
          options:
            - label: Low
              value: low
            - label: High
              value: high

set_motionflow:
  name: Set Motionflow
  description: Set the Motionflow frame-interpolation mode
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    mode:
      name: Mode
      description: Motionflow mode
      required: true
      selector:
        select:
          options:
            - label: "Off"
              value: "off"
            - label: Smooth High
              value: smooth_high
            - label: Smooth Low
              value: smooth_low
            - label: Impulse
              value: impulse
            - label: Combination
              value: combination
            - label: True Cinema
              value: true_cinema

set_aspect:
  name: Set Aspect Ratio
  description: Set the aspect ratio
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    mode:
      name: Mode
      description: Aspect ratio
      required: true
      selector:
        select:
          options:
            - label: Normal
              value: normal
            - label: V Stretch
              value: v_stretch
            - label: "1.85:1 Zoom"
              value: zoom_1_85
            - label: "2.35:1 Zoom"
              value: zoom_2_35
            - label: Stretch
              value: stretch
            - label: Squeeze
              value: squeeze

set_color_temp:
  name: Set Colour Temperature
  description: Set the colour temperature preset
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    mode:
      name: Mode
      description: Colour temperature preset
      required: true
      selector:
        select:
          options:
            - label: D93
              value: d93
            - label: D75
              value: d75
            - label: D65
              value: d65
            - label: D55
              value: d55
            - label: Custom 1
              value: custom1
            - label: Custom 2
              value: custom2
            - label: Custom 3
              value: custom3
            - label: Custom 4
              value: custom4
            - label: Custom 5
              value: custom5

