set_reality_creation:
  name: Set Reality Creation
  description: Set Reality Creation on or off
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    state:
      name: State
      description: Turn Reality Creation on or off
      required: true
      selector:
        select:
          options:
            - label: "On"
              value: "on"
            - label: "Off"
              value: "off"

toggle_reality_creation:
  name: Toggle Reality Creation
  description: Toggle Reality Creation on/off
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp

send_raw_command:
  name: Send Raw Command
  description: Send a raw ADCP command to the projector (advanced users only)
  target:
    entity:
      domain: media_player
      integration: sony_projector_adcp
  fields:
    command:
      name: Command
      description: The ADCP command to send (e.g., 'power "on"' or 'brightness 75')
      required: true
      example: 'picture_mode "cinema_film1"'
      selector:
        text: